---
- name: Install OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Look up the connecting user  # used for the lock-out safety check
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"
  when:
    - linux_hardening_ssh_lockout_check | bool
    - not linux_hardening_ssh_password_authentication | bool
    - ansible_user is defined

- name: Check that the connecting user has an authorized SSH key
  ansible.builtin.stat:
    path: "{{ ansible_facts['getent_passwd'][ansible_user][4] }}/.ssh/authorized_keys"
  register: linux_hardening_authorized_keys
  when: ansible_facts['getent_passwd'] is defined and ansible_user is defined

- name: Refuse to disable password logins without a key (prevents lock-out)
  ansible.builtin.assert:
    that: linux_hardening_authorized_keys.stat.exists
    fail_msg: >-
      {{ ansible_user }} has no ~/.ssh/authorized_keys. Deploy a key first or set
      linux_hardening_ssh_lockout_check=false if you know what you are doing.
    quiet: true
  when: linux_hardening_authorized_keys.stat is defined

- name: Ensure privilege separation directory exists (needed for sshd -t)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure drop-in directory is included first in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    state: present
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Deploy SSH hardening drop-in (sorted first, first value wins in sshd)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure ssh service is enabled and running
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started
  when: not linux_hardening_in_container | bool
